[build]
  command = "npm run build"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  # firebase-admin@14 requires Node >=22. NODE_VERSION does not fix
  # jwks-rsa@4 require() of ESM jose on AWS Lambda; that is handled by
  # the jose@4.15.9 override in package.json.
  NODE_VERSION = "22"
